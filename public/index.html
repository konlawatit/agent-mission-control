<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎛️ Agent Mission Control — Multi-Session Workflow Dashboard</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #131a27;
      --surface-hover: #1a2334;
      --surface-elevated: #1c2638;
      --border: #263248;
      --border-active: #3b82f6;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #8b5cf6;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Thai', sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Top Header */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 24px;
      background: rgba(19, 26, 39, 0.92);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.success { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.warning { background: var(--warning); box-shadow: 0 0 8px var(--warning); animation: pulse 1.5s infinite; }
    .dot.primary { background: var(--primary); box-shadow: 0 0 8px var(--primary); animation: pulse 1.8s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.2); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .btn:hover {
      background: var(--surface-hover);
      border-color: #3e5072;
    }
    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    .btn-warning {
      background: rgba(245, 158, 11, 0.15);
      border-color: var(--warning);
      color: #fbbf24;
    }
    .btn-warning:hover {
      background: rgba(245, 158, 11, 0.25);
    }
    .btn-success {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--success);
      color: #34d399;
    }

    /* Metrics Strip */
    .container {
      max-width: 1560px;
      margin: 0 auto;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .metric-card.alert-border {
      border-color: var(--warning);
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), var(--surface));
    }
    .metric-value {
      font-size: 24px;
      font-weight: 700;
      font-family: var(--font-mono);
    }
    .metric-label {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Attention Queue Banner */
    .attention-banner {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--warning);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    /* Main Split / Grid Views */
    .split-layout {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 1080px) {
      .split-layout {
        grid-template-columns: 1fr;
      }
    }

    .grid-layout {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 16px;
    }

    /* Room Cards */
    .room-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .room-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .room-card:hover {
      background: var(--surface-hover);
    }
    .room-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 8px 24px rgba(0, 0, 0, 0.35);
      background: var(--surface-elevated);
    }
    .room-card.needs-input {
      border-left: 4px solid var(--warning);
    }
    .room-card.working {
      border-left: 4px solid var(--primary);
    }
    .room-card.done {
      border-left: 4px solid var(--success);
    }

    .status-badge {
      font-size: 11.5px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .status-badge.needs_input {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.12);
    }
    .status-badge.working {
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.5);
      background: rgba(59, 130, 246, 0.12);
    }
    .status-badge.done, .status-badge.idle {
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.45);
      background: rgba(16, 185, 129, 0.1);
    }

    /* Workflow Pipeline Bar */
    .pipeline-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .stage-step {
      text-align: center;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      opacity: 0.6;
    }
    .stage-step.done {
      opacity: 0.95;
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.35);
    }
    .stage-step.current {
      opacity: 1;
      color: #60a5fa;
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.14);
    }

    /* Inspector Panel */
    .inspector {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 13px 15px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .subagent-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 7px;
    }
    .subagent-row:last-child {
      margin-bottom: 0;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .cmd-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .input-text {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-family: inherit;
    }
    .input-text:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-backdrop.open {
      display: flex;
    }
    .modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 520px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 24px;
      background: var(--surface-elevated);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.45);
      display: none;
      z-index: 200;
    }
  </style>
</head>
<body>
  <!-- Top Command Header -->
  <header class="topbar">
    <div class="brand">
      <h1>🎛️ Agent Mission Control</h1>
      <span class="pill" id="sse-status">
        <span class="dot success"></span>
        <span>Real-time Connected</span>
      </span>
      <button class="btn" id="hooks-btn" onclick="handleInstallHooks()">
        🔗 ตรวจสอบ Claude Hooks...
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
      <button class="btn" id="view-toggle-btn" onclick="toggleViewMode()">
        🗂️ สลับมุมมอง: Split / Grid
      </button>
      <button class="btn" onclick="seedDemoData()">
        🧪 โหลดห้องจำลอง (4 Rooms)
      </button>
      <button class="btn btn-primary" onclick="openSpawnModal()">
        + เปิดห้อง Agent ใหม่
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Top Overview Metrics -->
    <section class="metrics-grid" id="metrics-section"></section>

    <!-- Attention Queue Banner (Shows only when any tab needs approval/input) -->
    <section id="attention-section" style="display: none;"></section>

    <!-- Main Dynamic Layout (Split View or All-Rooms Grid View) -->
    <section id="main-workspace"></section>
  </main>

  <!-- Modal: Spawn New Agent Room -->
  <div class="modal-backdrop" id="spawn-modal">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:16px; font-weight:700;">🚀 เปิดห้องทำงาน Agent ใหม่ (New Session Room)</h3>
        <button class="btn" onclick="closeSpawnModal()">✕</button>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <label style="font-size:12px; color:var(--text-muted);">
          ชื่อห้องทำงาน (Room Name)
          <input id="spawn-room" class="input-text" style="width:100%; margin-top:4px;" placeholder="เช่น Room 05 • feature-notification" />
        </label>
        <label style="font-size:12px; color:var(--text-muted);">
          โฟลเดอร์โปรเจกต์ (Workspace Directory / Git Worktree)
          <input id="spawn-cwd" class="input-text mono" style="width:100%; margin-top:4px;" value="C:\Repo\agent-mission-control" />
        </label>
        <label style="font-size:12px; color:var(--text-muted);">
          เป้าหมาย / คำสั่งเริ่มต้น (Initial Goal)
          <input id="spawn-goal" class="input-text" style="width:100%; margin-top:4px;" placeholder="เช่น ตรวจสอบโครงสร้าง API และเขียน Unit Test" />
        </label>
        <div style="display:flex; gap:14px; padding-top:4px;">
          <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;">
            <input type="checkbox" id="spawn-open-wt" checked />
            เปิด Tab ใหม่ใน Windows Terminal ด้วย
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; cursor:pointer;">
            <input type="checkbox" id="spawn-headless" />
            สั่งรัน Claude CLI ในพื้นหลังทันที
          </label>
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
        <button class="btn" onclick="closeSpawnModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="submitSpawnRoom()">สร้างห้องทำงาน</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
